<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nager à Paris</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Nager à Paris</h1>
            <p>Trouvez votre spot idéal pour nager</p>
        </header>

        <section id="filter-menu" class="filter-container">
            <h2>Mes Critères</h2>
            <div id="search-summary" class="search-summary"></div>
            <div class="filter-grid">
                <div class="filter-group full-width">
                    <label for="filter-address">Votre Adresse</label>
                    <div class="autocomplete-container">
                        <input type="text" id="filter-address" placeholder="Ex: 12 rue de Rivoli, Paris" autocomplete="off">
                        <div id="address-suggestions" class="suggestions-dropdown"></div>
                    </div>
                </div>

                <div class="filter-group full-width">
                    <label>Je viens...</label>
                    <select id="filter-company">
                        <option value="solo">Solo</option>
                        <option value="couple">En couple</option>
                        <option value="potes">Entre potes</option>
                        <option value="enfants">Avec enfants</option>
                    </select>
                </div>

                <div class="filter-group full-width">
                    <label>Je nage...</label>
                    <select id="filter-style">
                        <option value="jo">Comme aux JO</option>
                        <option value="chill">Chill</option>
                        <option value="barbote">Je barbote</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filter-beaute">Beauté du lieu</label>
                    <input type="range" id="filter-beaute" min="0" max="10" value="5">
                    <span id="val-beaute">5</span>
                </div>
                <div class="filter-group">
                    <label for="filter-temp">Sensibilité eau froide</label>
                    <input type="range" id="filter-temp" min="0" max="10" value="5">
                    <span id="val-temp">5</span>
                </div>
                <div class="filter-group">
                    <label for="filter-freq">Fréquentation</label>
                    <input type="range" id="filter-freq" min="0" max="10" value="5">
                    <span id="val-freq">5</span>
                </div>
                <div class="filter-group">
                    <label for="filter-prop">Propreté</label>
                    <input type="range" id="filter-prop" min="0" max="10" value="5">
                    <span id="val-prop">5</span>
                </div>
            </div>
            <button id="search-btn">Rechercher le spot idéal</button>
        </section>

        <main id="pool-list">
            <!-- Pool cards will be injected here -->
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
